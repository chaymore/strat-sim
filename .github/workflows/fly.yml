name: fly-deploy

on:
  push:
    branches:
      - main
      - claude/plan-strategy-game-nB9eP
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read app name from fly.toml
        id: app
        run: |
          APP=$(awk -F'"' '/^app[[:space:]]*=/ {print $2; exit}' fly.toml)
          echo "name=$APP" >> "$GITHUB_OUTPUT"
          echo "App: $APP"

      - name: Ensure app exists on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl status --app "${{ steps.app.outputs.name }}" >/dev/null 2>&1; then
            echo "App ${{ steps.app.outputs.name }} already exists."
          else
            echo "Creating app ${{ steps.app.outputs.name }}..."
            flyctl apps create "${{ steps.app.outputs.name }}" --org personal
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app "${{ steps.app.outputs.name }}"
